apis:
- name: Udesk Open API v2
  description: The recommended tenant-scoped Open API for customers, tickets,
    organizations, agents, agent groups, departments, knowledge base, IM
    sessions, call center, outbound call tasks, questionnaires, work logs, and
    event-callback (webhook) management. Signed requests (SHA-256), JSON, 60
    requests/minute default.
  humanURL: https://www.udesk.cn/doc/apiv2/intro/
  baseURL: https://demo.udesk.cn/open_api_v1
  tags: [Customer Service, Tickets, Customers, Call Center, Webhooks]
  properties:
  - type: Documentation
    url: https://www.udesk.cn/doc/apiv2/intro/
  - type: Webhooks
    url: https://www.udesk.cn/doc/apiv2/webhook_v2/
- name: Udesk Open API v1 (legacy)
  description: Legacy Open API kept for existing integrations (tickets,
    customers, IM, call center, help center) with MD5 query-string signature
    auth; the docs recommend migrating to v2.
  humanURL: https://www.udesk.cn/doc/apiv1/intro/
  baseURL: https://demo.udesk.cn/api/v1
  tags: [Customer Service, Tickets, Customers, Legacy]
  properties:
  - type: Documentation
    url: https://www.udesk.cn/doc/apiv1/intro/
- name: Udesk Robot (GaussMind) API
  description: Bot platform API for applications and robots, FAQ knowledge
    bases, bot sessions, task-flow entities, external LLM integration, and the
    robot webhook integration hook.
  humanURL: https://www.udesk.cn/doc/robot/intro/
  baseURL: https://km.udesk.cn/api/v1
  tags: [Chatbots, Knowledge Base, AI]
  properties:
  - type: Documentation
    url: https://www.udesk.cn/doc/robot/intro/
- name: ServiceGo API
  description: Field-service / after-sales platform API — records, custom
    fields, filters, users, roles, queues, forms, approvals, SSO, event
    subscriptions, operation logs, and warehouse management.
  humanURL: https://www.udesk.cn/doc/sercive/general-instructions/
  baseURL: https://servicego.udesk.cn/api/v1
  tags: [Field Service, ITSM, Workflows]
  properties:
  - type: Documentation
    url: https://www.udesk.cn/doc/sercive/general-instructions/
  - type: Webhooks
    url: https://www.udesk.cn/doc/sercive/subscribe-event/
- name: Udesk KCS Knowledge API
  description: Knowledge center service API for knowledge spaces, categories,
    Q&A knowledge items, and file knowledge, authenticated with a 50-minute
    Bearer token from /api/auth/open/token.
  humanURL: https://www.udesk.cn/doc/kcs/kcs-intro/
  baseURL: https://knowledgeservice.udesk.cn/api/sdk
  tags: [Knowledge Management, Search]
  properties:
  - type: Documentation
    url: https://www.udesk.cn/doc/kcs/kcs-intro/
