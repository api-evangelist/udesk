aid: udesk
name: Udesk
description: >-
  Udesk, the flagship product of Beijing Wofeng Times Data Technology
  (沃丰科技/Wofeng Technology), is a Chinese intelligent customer service and
  customer-experience platform serving enterprises like Yili, BYD, Schneider
  Electric, and China Merchants Group. The suite spans omnichannel IM
  (20+ channels including WeChat, Weibo, and mini-programs), ticketing, a
  cloud call center with CC PaaS APIs, GaussMind LLM-powered chat/voice
  robots, ServiceGo field-service management, KCS knowledge management, and
  video customer service. Its developer center publishes REST-style Open
  APIs (v2 recommended, v1 legacy), event-callback webhooks, and
  mobile/web SDKs, all tenant-scoped with signed-request authentication.
